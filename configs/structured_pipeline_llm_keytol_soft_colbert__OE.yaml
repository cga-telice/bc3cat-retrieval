# S11 K2, the proposed method (design frozen at 931ee0c): K1 with soft matching. The family is tiered by how many
# usable extracted axes each leaf agrees with, then ordered by within-family ColBERT score (A1, A3, A6, A7).
collection: OE

paths:
  data_dir: /work/data/processed
  index_root: /work/index

inputs:
  short_feats: "{data_dir}/{collection}_short_feats.parquet"
  long_feats: "{data_dir}/{collection}_long_feats.parquet"

method:
  family: structured
  name: structured_pipeline_llm_keytol_soft_colbert__OE
  impl: structured_pipeline_llm
  save_as: structured_pipeline_llm_keytol_soft_colbert__OE
  params:
    stage2_method: llm
    llm_model: "phi4:latest"
    llm_prompt_mode: extract
    llm_key_match: tolerant
    oracle: false
    stage1_index: dense_e5__OE
    stage3_value_match: normalized
    stage3_match: soft
    family_order: colbert

io:
  data_dirname: data
  mapping_file: mapping.jsonl
  fields_file: fields.json
  meta_file: meta.json

retriever:
  module: src.retrievers.structured_pipeline_llm
  entrypoint: load
