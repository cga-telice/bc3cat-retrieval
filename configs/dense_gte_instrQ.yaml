# Dense GTE (Spanish/multilingual) with instruct prefix
collection: OEB

paths:
  data_dir: /work/data/processed
  index_root: /work/index

inputs:
  short_text_path: "{data_dir}/{collection}_resumen.json"
  long_text_path: "{data_dir}/{collection}_texto.json"

method:
  family: dense
  name: dense_gte_instrQ
  impl: dense_gte
  save_as: dense_gte_instrQ
  params:
    model_name: Alibaba-NLP/gte-multilingual-base
    batch_size: 256
    max_length: 512
    normalize: true
    # Docs (applied at index time):
    add_doc_prefix: false
    doc_prefix: ""
    # Queries (applied at retrieval time):
    add_query_prefix: true # IMPORTANT: "query" prefix for this model
    query_prefix: "query: Busca el documento que más se parezca a la siguiente consulta: "
    device: "cuda"
    trust_remote_code: true
    # Misma configuracion que dense_gte salvo el prefijo de consulta, que es
    # justamente la variable que esta comparacion aisla.
    pooling: cls
    force_backend: hf

index:
  # Where the index artifacts will be written (same layout as lexical methods)
  output_dir: /index/dense_gte_instrQ

builder:
  module: src.index_builders.dense_gte

retriever:
  module: src.retrievers.dense_gte
  class: DenseSearcher
  params:
    topk: 100

io:
  data_dirname: data
  mapping_file: mapping.jsonl
  fields_file: fields.json
  meta_file: meta.json
