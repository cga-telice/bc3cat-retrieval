# BM25 (unigrams) — OEB
collection: "OEB"

paths:
  data_dir: "/work/data/processed"
  index_root: "/work/index"

inputs:
  short_feats: "{data_dir}/{collection}_short_feats.parquet"
  long_feats:  "{data_dir}/{collection}_long_feats.parquet"
  features_meta: "{data_dir}/{collection}_features_meta.json"

method:
  family: "bm25"
  name: "bm25_unigram"
  params:
    analyzer: "word"
    ngram_range: [1, 1]
    lowercase: true
    token_pattern: "(?u)\\b\\w+\\b"
    strip_accents: "unicode"
    # BM25 knobs
    k1: 1.2
    b: 0.75

io:
  data_dirname: "data"
  mapping_file: "mapping.jsonl"
  fields_file: "fields.json"
  meta_file: "meta.json"

retriever:
  module: src.retrievers.bm25_unigram
  entrypoint: load
