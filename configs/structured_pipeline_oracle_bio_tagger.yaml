# Structured pipeline: oracle parent_key + shared BIO tagger Stage 2 + catalog lookup Stage 3
collection: OEB

paths:
  data_dir: /work/data/processed
  index_root: /work/index

inputs:
  short_feats: "{data_dir}/{collection}_short_norm.parquet"
  long_feats: "{data_dir}/{collection}_long_norm.parquet"

method:
  family: structured
  name: structured_pipeline_oracle_bio_tagger
  impl: structured_pipeline_oracle_bio_tagger
  params:
    stage2_method: bio_tagger
    oracle: true
    stage2_model_dir: /work/models/e5_bio_tagger
    text_field: text_norm

io:
  data_dirname: data
  mapping_file: mapping.jsonl
  fields_file: fields.json
  meta_file: meta.json
# Exported 2026-10-12: params above were empty; filled from the source below. Nothing was re-run.
pseudo_index:
  note: The pipeline reads these params from index/<name>/meta.json; that file is not versioned and was
    lost with index/ (D-019). Stage 1 is the dense_e5 index.
  stage1_index: /work/index/dense_e5
in_paper_table: false
source:
  params: docs/sprints/SPRINT_LWN_03.md C1.d (git b3550e7)
  code: src/retrievers/structured_pipeline.py (load)
