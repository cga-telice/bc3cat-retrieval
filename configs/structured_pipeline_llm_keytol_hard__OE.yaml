# S11 K0 (design frozen at 931ee0c; A4): S9's A7 key-tolerant arm, registered. Parameters identical to
# structured_pipeline_llm_keytol_valuenorm__OE (hard filter, catalogue order); a new name so S11's runs never
# overwrite S9's. Its top 100 on the five S9 bases is compared with S9's query by query (A4).
collection: OE

paths:
  data_dir: /work/data/processed
  index_root: /work/index

inputs:
  short_feats: "{data_dir}/{collection}_short_feats.parquet"
  long_feats: "{data_dir}/{collection}_long_feats.parquet"

method:
  family: structured
  name: structured_pipeline_llm_keytol_hard__OE
  impl: structured_pipeline_llm
  save_as: structured_pipeline_llm_keytol_hard__OE
  params:
    stage2_method: llm
    llm_model: "phi4:latest"
    llm_prompt_mode: extract
    llm_key_match: tolerant
    oracle: false
    stage1_index: dense_e5__OE
    stage3_value_match: normalized

io:
  data_dirname: data
  mapping_file: mapping.jsonl
  fields_file: fields.json
  meta_file: meta.json

retriever:
  module: src.retrievers.structured_pipeline_llm
  entrypoint: load
