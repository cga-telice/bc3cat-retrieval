# Dense E5 on OE — Stage 1 of structured_pipeline_rules__OE (S2).
# Same model and parameters as configs/dense_e5.yaml, which is what the source branch's
# structured pipeline read as index/dense_e5.
collection: OE

paths:
  data_dir: /work/data/processed
  index_root: /work/index

inputs:
  short_text_path: "{data_dir}/{collection}_resumen.json"
  long_text_path: "{data_dir}/{collection}_texto.json"

method:
  family: dense
  name: dense_e5__OE
  save_as: dense_e5__OE
  impl: dense_e5
  params:
    model_name: intfloat/multilingual-e5-base
    batch_size: 256
    max_length: 512
    normalize: true
    # Docs (applied at index time):
    add_doc_prefix: true
    doc_prefix: "passage: "
    # Queries (applied at retrieval time):
    add_query_prefix: true
    query_prefix: "query: Busca el documento que más se parezca a la siguiente consulta: "
    device: "cuda"
    trust_remote_code: true

retriever:
  module: src.retrievers.dense_e5
  entrypoint: load

io:
  data_dirname: data
  mapping_file: mapping.jsonl
  fields_file: fields.json
  meta_file: meta.json
