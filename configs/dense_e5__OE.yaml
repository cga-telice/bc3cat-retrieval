# Dense E5 on OE — Stage 1 of structured_pipeline_rules__OE (S2).
# Same model and parameters as configs/dense_e5.yaml, which is what the source branch's
# structured pipeline read as index/dense_e5.
collection: OE

paths:
  data_dir: /work/data/processed
  index_root: /work/index

# Parquet, not the JSON corpus files dense_e5.yaml names: index_builder.ipynb's _read_df reads
# a one-line JSON array with lines=True and gets one row of 70,242 columns (S2). The `text`
# column of the feature tables equals the JSON `text`, row for row, on all four query sets.
inputs:
  short_feats: "{data_dir}/{collection}_short_feats.parquet"
  long_feats: "{data_dir}/{collection}_long_feats.parquet"

method:
  family: dense
  name: dense_e5__OE
  save_as: dense_e5__OE
  impl: dense_e5
  params:
    model_name: intfloat/multilingual-e5-base
    batch_size: 256
    max_length: 512
    normalize: true
    # Docs (applied at index time):
    add_doc_prefix: true
    doc_prefix: "passage: "
    # Queries (applied at retrieval time):
    add_query_prefix: true
    query_prefix: "query: Busca el documento que más se parezca a la siguiente consulta: "
    device: "cuda"
    trust_remote_code: true

retriever:
  module: src.retrievers.dense_e5
  entrypoint: load

io:
  data_dirname: data
  mapping_file: mapping.jsonl
  fields_file: fields.json
  meta_file: meta.json
